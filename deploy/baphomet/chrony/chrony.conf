# open-nvr: servidor NTP para el NVR, sin acceso a Internet para él.
#
# Baphomet ya tiene la hora sincronizada con systemd-timesyncd. chronyd corre
# con -x (no toca el reloj) y sin fuentes propias: `local` le hace servir el
# reloj del sistema como referencia de estrato 10.
local stratum 10

# Solo responde en la IP LAN de Baphomet y solo al NVR.
bindaddress 192.168.0.8
port 123
allow 192.168.0.227

# Sin socket de control remoto ni archivos persistentes (raíz de solo lectura).
cmdport 0
