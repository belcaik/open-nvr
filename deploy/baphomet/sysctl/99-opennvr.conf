# open-nvr: Baphomet como puerta de enlace del NVR (192.168.0.227).
# Instalar en /etc/sysctl.d/99-opennvr.conf y aplicar con `sysctl --system`.

# Reenvío IPv4. podman/netavark ya lo activa al arrancar contenedores; aquí se
# fija de forma declarativa para no depender de ello.
net.ipv4.ip_forward = 1

# Sin ICMP redirects.
#
# El NVR y el router (192.168.0.1) están en la misma subred que Baphomet.
# Cuando el NVR envía a Baphomet un paquete cuyo siguiente salto es el router,
# Linux detecta que entra y sale por la misma interfaz y, por defecto, envía
# al NVR un ICMP redirect: "usa 192.168.0.1 directamente". Si el NVR lo
# acepta, sus paquetes dejan de pasar por Baphomet y se pierde toda la
# visibilidad y el filtrado, sin ningún error visible.
#
# El valor efectivo por interfaz es all OR <iface>, así que hay que poner a 0
# `all` y la interfaz concreta. `default` cubre interfaces creadas después.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Interfaz LAN de Baphomet verificada el 2026-10-27 (`ip route get 192.168.0.227`).
# Si el nombre lleva puntos (VLAN, p. ej. eno1.10), escribir eno1/10.
net.ipv4.conf.enp6s0.send_redirects = 0

# IPv6: no se cambia el reenvío del host (podría afectar a redes de podman).
# El tráfico IPv6 del NVR se bloquea en la tabla nft `inet opennvr`.
