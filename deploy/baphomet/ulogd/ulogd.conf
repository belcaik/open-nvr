# open-nvr: ulogd2 lee los grupos NFLOG de la tabla `inet opennvr` y los
# escribe en JSON (una línea por paquete) para egress-watch.
#   grupo 1: tráfico del NVR reenviado (permitido)  -> nvr-fwd.json
#   grupo 2: tráfico del NVR descartado             -> nvr-drop.json

[global]
logfile="stdout"
loglevel=3

# El Dockerfile enlaza el directorio de plugins de Debian en esta ruta.
plugin="/opt/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/opt/ulogd/ulogd_raw2packet_BASE.so"
plugin="/opt/ulogd/ulogd_filter_IFINDEX.so"
plugin="/opt/ulogd/ulogd_filter_IP2STR.so"
plugin="/opt/ulogd/ulogd_filter_HWHDR.so"
plugin="/opt/ulogd/ulogd_output_JSON.so"

stack=fwd:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,mac2str1:HWHDR,jsonfwd:JSON
stack=drop:NFLOG,base2:BASE,ifi2:IFINDEX,ip2str2:IP2STR,mac2str2:HWHDR,jsondrop:JSON

[fwd]
group=1
netlink_socket_buffer_size=217088
netlink_socket_buffer_maxsize=1085440

[drop]
group=2
netlink_socket_buffer_size=217088
netlink_socket_buffer_maxsize=1085440

[jsonfwd]
file="/var/log/ulogd/nvr-fwd.json"
sync=1

[jsondrop]
file="/var/log/ulogd/nvr-drop.json"
sync=1
