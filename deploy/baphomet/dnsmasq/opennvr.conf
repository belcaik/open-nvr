# open-nvr: DNS del NVR con lista permitida.
#
# Responde solo a los nombres de allow.conf (reenviándolos al servidor que
# indique cada línea) y devuelve NXDOMAIN para todo lo demás. Registra todas
# las consultas en /var/log/dnsmasq/queries.log, que lee egress-watch.
#
# La dirección de escucha llega por línea de órdenes (--listen-address,
# variable DNS_BIND de .env); ver compose.yaml.

# Solo DNS: sin dhcp-range ni enable-tftp, dnsmasq no ofrece DHCP ni TFTP.
port=53
bind-interfaces
no-hosts
no-resolv
no-poll

# NXDOMAIN para cualquier nombre que no tenga una regla más específica en
# allow.conf. dnsmasq elige la coincidencia de dominio más larga, así que
# `server=/pool.ntp.org/1.1.1.1` gana a esta regla.
address=/#/

# Sin caché: cada consulta del NVR aparece en el registro con su respuesta.
cache-size=0

log-queries=extra
log-facility=/var/log/dnsmasq/queries.log

conf-file=/etc/dnsmasq.d/allow.conf
