# Nombres que el NVR puede resolver. Vacío por defecto: todo NXDOMAIN.
#
# Una línea por dominio (incluye subdominios), con el servidor de resolución:
#   server=/pool.ntp.org/1.1.1.1
#
# Resolver un nombre no basta para que el NVR lo alcance: la IP resultante
# también tiene que estar en el set `nvr_allow4` de nftables/opennvr.nft.
#
# Tras editar: podman-compose --profile dns restart dnsmasq
