# Broker MQTT para Home Assistant. Solo loopback: opennvr-web y Home
# Assistant usan la red del host y se conectan a 127.0.0.1:1883.
listener 1883 127.0.0.1
allow_anonymous false
password_file /run/secrets/mqtt_passwd
acl_file /mosquitto/config/acl

# Los mensajes retenidos (discovery y estados) sobreviven a reinicios.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
