name: tests and images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          for d in services/common services/nvr-watch services/egress-watch; do
            (cd "$d" && PYTHONPATH=.:../common python -m unittest discover -s tests -v)
          done
      - name: Compile all Python
        run: python -m compileall -q services tools

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nvr-watch
            context: services
            dockerfile: services/nvr-watch/Dockerfile
          - name: egress-watch
            context: services
            dockerfile: services/egress-watch/Dockerfile
          - name: ulogd
            context: deploy/baphomet/ulogd
            dockerfile: deploy/baphomet/ulogd/Dockerfile
          - name: dnsmasq
            context: deploy/baphomet/dnsmasq
            dockerfile: deploy/baphomet/dnsmasq/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-nvr-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
