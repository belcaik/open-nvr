<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
<title>{{if .Title}}{{.Title}} · {{end}}open-nvr</title>
<link rel="icon" href="{{asset "/static/favicon.svg"}}" type="image/svg+xml">
<link rel="stylesheet" href="{{asset "/static/app.css"}}">
{{block "head" .}}{{end}}
<script src="{{asset "/static/vendor/htmx.min.js"}}" defer></script>
</head>
<body{{if .CSRF}} hx-headers='{"X-CSRF-Token":"{{.CSRF}}"}' data-csrf="{{.CSRF}}"{{end}}>
{{if .User}}
<header class="bar">
  <a class="brand" href="/">open-nvr</a>
  <nav class="main-nav"><a href="/">Directo</a><a href="/recordings">Grabaciones</a><a href="/settings">Ajustes</a></nav>
  <div id="status" hx-get="/api/health" hx-trigger="load, every 15s" hx-swap="innerHTML"></div>
  <form method="post" action="/logout">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <button class="link" type="submit">Salir</button>
  </form>
</header>
{{end}}
<main>
{{template "content" .}}
</main>
{{block "scripts" .}}{{end}}
{{if .User}}<script type="module" src="{{asset "/static/js/events.js"}}"></script>{{end}}
</body>
</html>
